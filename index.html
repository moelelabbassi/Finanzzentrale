function saveIncomeSettings(e){e.preventDefault();Object.assign(S.settings,{incomePrivat:num($('#is_inc').value),incomeDay:Math.min(28,Math.max(1,num($('#is_day').value)||1)),incomeAccount:$('#is_acc').value,savingGoal:num($('#is_save').value),buffer:num($('#is_buf').value)});persist();closeModal();render();toast('Monatsplan gespeichert');}

/* ========================================================================
   FINANZ-CHECK
   ======================================================================== */
function checkSteps(st){
  const since=st.last?parseD(st.last.date):new Date(Date.now()-86400000*16);
  const di=dataIssues();
  const steps=[];
  // 1 Kontostände
  steps.push({key:'balances',icon:'🏦',title:'Kontostände aktualisieren',desc:'Schau in deine Banking-App und trag die aktuellen Salden ein. Damit stimmt die Liquiditätsvorschau.',
    auto:()=>S.accounts.length>0&&S.accounts.every(a=>a.updated&&parseD(a.updated)>=st.ps),
    body:()=>S.accounts.length?S.accounts.map(a=>`<div class="qrow"><div class="l"><b>${esc(a.name)}</b><div class="sub" id="upd_${a.id}">${a.updated?'aktualisiert '+relDays(daysUntil(a.updated)):'noch nie aktualisiert'}${a.bank?' · '+esc(a.bank):''}</div></div>
      <input class="inline-input num" type="number" step="0.01" value="${a.balance??''}" onchange="updateBalance('${a.id}',this.value)" aria-label="Saldo ${esc(a.name)}"></div>`).join('')
      :`<p class="hint">Noch keine Konten angelegt.</p><button class="btn primary sm" onclick="openAcc()">${icPlus()} Konto anlegen</button>`});
  // 2 Raten
  const dm=debtMetrics();const withRate=dm.active.filter(d=>debtRate(d)>0);
  const paidRecently=d=>S.payments.some(p=>p.debtId===d.id&&p.date&&daysBetween(parseD(p.date),new Date())<=28);
  steps.push({key:'debts',icon:'💳',title:'Raten & Zahlungen abhaken',desc:'Was hast du seit dem letzten Check an Gläubiger gezahlt? Ein Klick verbucht die geplante Rate.',
    auto:()=>withRate.every(paidRecently),
    body:()=>withRate.length?withRate.map(d=>{const lp=[...S.payments].filter(p=>p.debtId===d.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
      return `<div class="qrow"><div class="l"><b>${esc(d.creditor)}</b><div class="sub">offen ${eur(d.current)} · ${lp?`zuletzt ${eur(lp.amount)} am ${fmtDate(lp.date)}`:'noch keine Zahlung erfasst'}</div></div>
      <div class="row-act">${paidRecently(d)?`<span class="pill good">✓ diesen Monat bezahlt</span>`:''}<button class="btn good sm" onclick="quickPay('${d.id}')">✓ ${eur(debtRate(d))} gezahlt</button><button class="btn ghost sm" onclick="openPay('${d.id}')">anderer Betrag</button></div></div>`;}).join('')
      :`<p class="hint">Keine offenen Raten 🎉</p>`});
  // 3 Provisionen
  const openC=S.commissions.filter(c=>c.status!=='Bezahlt').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  steps.push({key:'commissions',icon:'💼',title:'Provisionen prüfen',desc:'Neue Abrechnungen erfassen, eingegangene Zahlungen als bezahlt markieren.',
    auto:()=>false,
    body:()=>`${openC.length?openC.map(c=>`<div class="qrow"><div class="l"><b>${esc(c.client||'–')}</b><div class="sub">${fmtDate(c.date)} · ${esc(c.desc||'')}</div></div>
      <div class="row-act"><span class="num">${eur(num(c.net)+num(c.vat))}</span><button class="btn good sm" onclick="markCommPaid('${c.id}')">Bezahlt ✓</button></div></div>`).join(''):`<p class="hint">Keine offenen Abrechnungen.</p>`}
      <button class="btn biz sm" style="margin-top:10px" onclick="openComm()">${icPlus()} Neue Abrechnung</button>`});
  // 4 Belege
  const newExp=S.expenses.filter(x=>x.date&&parseD(x.date)>=since);
  steps.push({key:'receipts',icon:'🧾',title:'Belege & Reisen erfassen',desc:`Seit ${fmtD(since)}: ${newExp.length} Beleg(e) über ${eur(newExp.reduce((s,x)=>s+num(x.net),0))} netto erfasst.`,
    auto:()=>false,
    body:()=>`<div class="row-act"><button class="btn biz sm" onclick="openExp()">${icPlus()} Beleg</button><button class="btn sm" onclick="openTrip()">${icPlane()} Reise</button><button class="btn ghost sm" onclick="go('expenses')">Alle Ausgaben</button></div>`});
  // 5 Ausblick
  const fc=liquidityForecast(null,16);const outs=fc.rows.filter(r=>r.amount<0);
  steps.push({key:'outlook',icon:'📅',title:'Die nächsten 2 Wochen',desc:`${outs.length} Abbuchung(en) über ${eur(outs.reduce((s,r)=>s-r.amount,0))} bis zum nächsten Check. Reicht das Geld auf den richtigen Konten?`,
    auto:()=>false,
    body:()=>`${outs.slice(0,10).map(r=>`<div class="qrow"><div class="l"><b>${esc(r.label)}</b><div class="sub">${fmtDay(r.date)} · ${esc(r.kind)}${r.accId&&accountName(r.accId)?' · '+esc(accountName(r.accId)):' · <span style="color:var(--warn)">kein Konto</span>'}</div></div><span class="num" style="color:var(--bad)">−${eur(-r.amount)}</span></div>`).join('')||'<p class="hint">Nichts geplant.</p>'}
      ${fc.firstNeg?`<div class="insight bad" style="margin-top:10px"><div class="ii">🔴</div><div><b>Engpass am ${fmtD(fc.firstNeg)}</b><span>Tiefststand ${eur(fc.minBal)} – jetzt umbuchen.</span></div></div>`:''}`});
  // 6 Fristen
  const al=collectAlerts().filter(a=>a.when&&a.days<=45);
  steps.push({key:'deadlines',icon:'⏰',title:'Fristen & Fälligkeiten',desc:'Kündigungsfristen und fällige Verbindlichkeiten der nächsten 45 Tage.',
    auto:()=>al.length===0,
    body:()=>al.length?insightCard(al.map(a=>({k:a.sev==='soft'?'':a.sev,i:a.sev==='bad'?'🔴':a.sev==='warn'?'🟡':'🔵',t:a.title,s:`${a.cat} · ${a.desc}`,go:a.go}))):`<p class="hint">Keine Fristen in Sicht ✓</p>`});
  // 7 Monatsabschluss oder Sparziele
  if(st.isMonthStart){
    const pm=addMonths(new Date(),-1);const key=`${pm.getFullYear()}-${pad(pm.getMonth()+1)}`;const ex=S.months.find(m=>m.month===key);
    steps.push({key:'monthclose',icon:'📊',title:`Monatsabschluss ${pm.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}`,desc:'Was kam tatsächlich rein, was ging variabel raus? So siehst du über die Monate, ob der Plan aufgeht.',
      auto:()=>!!S.months.find(m=>m.month===key),
      body:()=>`<div class="form" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        <div class="field"><label>Einnahmen tatsächlich</label><input id="mc_inc" type="number" step="0.01" value="${ex?ex.actualIncome:(S.settings.incomePrivat||'')}"></div>
        <div class="field"><label>Variable Ausgaben tatsächlich</label><input id="mc_var" type="number" step="0.01" value="${ex?ex.actualVariable:''}" placeholder="Budget: ${eur0(varTotal())}"></div>
        <div class="field"><label>&nbsp;</label><button class="btn primary" onclick="saveMonthClose('${key}')">${ex?'Aktualisieren':'Abschluss speichern'}</button></div></div>
        ${ex?`<p class="hint" style="margin-top:8px">Saldo ${key}: <b style="color:${monthSaldo(ex)>=0?'var(--good)':'var(--bad)'}">${eur(monthSaldo(ex))}</b></p>`:''}`});
  }else{
    const gs=S.goals.filter(g=>num(g.saved)<num(g.target));
    steps.push({key:'goals',icon:'🎯',title:'Sparziele bedienen',desc:'Hast du deine Sparraten diesen Monat überwiesen? Ein Klick bucht sie aufs Ziel.',
      auto:()=>gs.length===0,
      body:()=>gs.length?gs.map(g=>`<div class="qrow"><div class="l"><b>${esc(g.name)}</b><div class="sub">${eur0(g.saved)} von ${eur0(g.target)}</div></div>
        <div class="row-act">${num(g.rate)?`<button class="btn good sm" onclick="depositGoal('${g.id}',${num(g.rate)})">+ ${eur0(g.rate)} eingezahlt</button>`:''}<button class="btn ghost sm" onclick="openDeposit('${g.id}')">anderer Betrag</button></div></div>`).join('')
        :`<p class="hint">Keine offenen Sparziele.</p><button class="btn sm" onclick="openGoal()">${icPlus()} Sparziel anlegen</button>`});
  }
  // 8 Datenqualität
  steps.push({key:'quality',icon:'🔍',title:'Datenqualität',desc:'Doppelt erfasste Zahlungen, fehlende Daten und Posten ohne Konto verfälschen die Vorschau.',
    auto:()=>di.count===0,
    body:()=>di.count?`

let calMonth=new Date().getMonth(), calYear=new Date().getFullYear(), calSel=null;
function calEvents(){
  const from=new Date(calYear,calMonth,1),to=new Date(calYear,calMonth+1,0);
  const cf=buildCashflowEvents(from,to,null);
  const byDay={};const add=(d,e)=>(byDay[d]=byDay[d]||[]).push(e);
  cf.events.forEach(ev=>add(ev.date.getDate(),{type:ev.amount<0?'out':'in',label:ev.label,amount:ev.amount,kind:ev.kind,go:ev.go}));
  [...S.contracts.map(c=>({...c,_go:'contracts'})),...S.insurances.map(i=>({...i,_go:'insurances'}))].forEach(c=>{
    if(!c.cancelBy)return;const d=parseD(c.cancelBy);if(d.getMonth()===calMonth&&d.getFullYear()===calYear)add(d.getDate(),{type:'cancel',label:c.name,kind:'Kündigungsfrist',go:c._go});});
  S.debts.filter(x=>x.dueDate&&num(x.current)>0&&x.status!=='Erledigt').forEach(x=>{const d=parseD(x.dueDate);if(d.getMonth()===calMonth&&d.getFullYear()===calYear)add(d.getDate(),{type:'debt',label:x.creditor,kind:'Verbindlichkeit fällig',go:'debts'});});
  checkDays().forEach(d=>{if(d<=daysInMonth(calYear,calMonth))add(d,{type:'chk',label:'Finanz-Check',kind:'Routine',go:'check'});});
  return{byDay,cf};
}
function viewCalendar(){
  const first=new Date(calYear,calMonth,1);

  const {byDay,cf}=calEvents();
  const totalOut=cf.events.filter(e=>e.amount<0).reduce((s,e)=>s+e.amount,0);
  const totalIn=cf.events.filter(e=>e.amount>0).reduce((s,e)=>s+e.amount,0);

  view.innerHTML=topbar('Überblick','','Termine & Fristen','Alle Abbuchungen, Eingänge, Kündigungsfristen und Fälligkeiten – mit Handlungsbedarf ganz oben.',
    `<button class="btn ghost" onclick="calShift(-1)" aria-label="Vormonat">←</button><button class="btn" onclick="calToday()" style="min-width:170px;justify-content:center">${monthName}</button><button class="btn ghost" onclick="calShift(1)" aria-label="Folgemonat">→</button>`)
  + (urgent.length?`<div class="card" style="margin-bottom:16px;border-color:rgba(248,113,113,.35)"><div class="card-head"><h3>${icWarn()} Handlungsbedarf (${urgent.length})</h3></div>${insightCard(urgent.map(a=>({k:a.sev,i:a.sev==='bad'?'🔴':'🟡',t:a.title,s:`${a.cat} · ${a.desc}${a.when?' · '+fmtDate(a.when):''}`,go:a.go})))}</div>`:'')
  + `<div class="grid cols3 keep2" style="margin-bottom:16px">
    ${kpi('Abbuchungen',eur(Math.abs(totalOut)),monthName,icDown(),'var(--bad)')}
    ${kpi('Eingänge',eur(totalIn),totalIn?'geplant':'Einnahmen im Cockpit eintragen',icUp(),'var(--good)')}
    ${kpi('Saldo des Monats',eur(totalIn+totalOut),'Eingänge − Abbuchungen',icWallet(),totalIn+totalOut>=0?'var(--good)':'var(--bad)')}
  </div>
  ${cf.missing.length?`<div class="insight" style="margin-bottom:16px"><div class="ii">📆</div><div><b>${cf.missing.length} Posten fehlen im Kalender</b><span>Ohne Fälligkeitsdatum (jährlich/quartalsweise): ${cf.missing.slice(0,5).map(x=>`<button class="linkbtn" onclick="go('${x.go}')">${esc(x.label)}</button>`).join(', ')}${cf.missing.length>5?' …':''}</span></div></div>`:''}
  <div class="card"><div id="calGrid"></div></div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>${calSel?`${calSel}. ${monthName}`:`Liste – ${monthName}`}</h3>${calSel?`<button class="btn ghost sm" onclick="calSel=null;viewCalendar()">Ganzer Monat</button>`:''}</div>${calList(byDay)}</div>
  ${soft.length?`<div class="card" style="margin-top:16px"><div class="card-head"><h3>Zum Vormerken</h3></div>${insightCard(soft.map(a=>({i:'🔵',t:a.title,s:`${a.cat} · ${a.desc}`,go:a.go})))}</div>`:''}`;
  const startWeekday=(first.getDay()+6)%7;const dim=daysInMonth(calYear,calMonth);
  const todayD=new Date();
  let html=`<div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="wd">${d}</div>`).join('')}`;
  for(let i=0;i<startWeekday;i++)html+=`<div></div>`;
  const col={out:'var(--bad)',in:'var(--good)',cancel:'var(--warn)',debt:'var(--accent)',chk:'var(--good)'};
  for(let d=1;d<=dim;d++){
    const evs=byDay[d]||[];const isToday=todayD.getDate()===d&&todayD.getMonth()===calMonth&&todayD.getFullYear()===calYear;
    const sum=evs.reduce((s,e)=>s+(e.amount||0),0);
    html+=`<button class="cell ${isToday?'today':''} ${calSel===d?'sel':''} ${evs.some(e=>e.type==='chk')?'check':''}" onclick="calSel=${calSel===d?'null':d};viewCalendar()">
      <div class="dn"><span>${d}</span>${sum?`<span class="num" style="font-size:10px;color:${sum<0?'var(--bad)':'var(--good)'}">${sum<0?'−':'+'}${eur0(Math.abs(sum))}</span>`:''}</div>
      ${evs.slice(0,3).map(e=>`<div class="ev ${e.type}">${esc(e.label)}</div>`).join('')}${evs.length>3?`<div class="more">+${evs.length-3} weitere</div>`:''}
      <div class="dots">${evs.slice(0,5).map(e=>`<i style="background:${col[e.type]}"></i>`).join('')}</div>
    </button>`;
  }
  html+=`</div><div class="legend" style="margin-top:14px"><span><i style="background:var(--bad)"></i>Abbuchung</span><span><i style="background:var(--good)"></i>Eingang / Check</span><span><i style="background:var(--warn)"></i>Kündigungsfrist</span><span><i style="background:var(--accent)"></i>Verbindlichkeit fällig</span></div>`;
  $('#calGrid').innerHTML=html;
}
function calShift(n){calMonth+=n;calSel=null;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}viewCalendar();}

  if(!days.length)return emptyBox('🗓️','Keine Termine',calSel?'An diesem Tag ist nichts geplant.':'In diesem Monat sind keine Fälligkeiten erfasst.','');

/* ========================================================================
   VERBINDLICHKEITEN
   ======================================================================== */
function debtProgress(d){const o=num(d.original),c=num(d.current);return o?Math.max(0,Math.min(100,(o-c)/o*100)):0;}
function dueClass(d){if(!d.dueDate||num(d.current)<=0)return 'good';const dd=daysUntil(d.dueDate);if(dd<0)return 'bad';if(dd<45)return 'warn';return 'good';}
const DEBT_TYPES=['Darlehen','Kreditkarte','Rechnung','Steuern','Ratenkauf','Privatdarlehen','Sonstiges'];
const DEBT_STATUS=['Aktiv','Stundung','In Klärung','Erledigt'];
const STRATEGIES={manual:'Meine Reihenfolge (⋮⋮ ziehen)',interest:'Höchster Zins zuerst',smallest:'Kleinste Restschuld zuerst',due:'Fälligkeit zuerst',priority:'Priorität-Feld zuerst'};
let debtShowDone=false;

function viewDebts(){
  const m=debtMetrics(),plan=buildPlan();
  const debtFree=plan.debtFreeMonth!=null?monthLabel.format(addMonths(new Date(),plan.debtFreeMonth)):'Budget prüfen';
  view.innerHTML=topbar('Privat & Geschäftlich','privat','Verbindlichkeiten','Alle Schulden in deiner Reihenfolge: ganz oben steht, was zuerst weg soll. Einfach am ⋮⋮-Griff verschieben.',
    `<button class="btn primary" onclick="openDebt()">${icPlus()} Verbindlichkeit</button><button class="btn good" onclick="openPay()">${icCheck()} Zahlung</button>`)
  + `<div class="grid cols4 keep2" style="margin-bottom:16px">
    ${kpi('Offen gesamt',eur(m.open),`${m.active.length} offene Position(en)`,icCard(),'var(--bad)')}
    ${kpi('Bereits getilgt',eur(m.paid),pct(m.progress),icUp(),'var(--good)')}
    ${kpi('Raten / Monat',eur(m.planned),`davon Pflicht ${eur0(m.min)}`,icCalendar(),'var(--biz)')}
    ${kpi('Schuldenfrei vsl.',debtFree,`bei ${eur0(plan.monthlyBudget)}/Monat`,icCheck(),'var(--priv)')}
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-head" style="flex-wrap:wrap"><div><h3>Deine Verbindlichkeiten</h3><div class="hint">Position 1 = höchste Priorität. Bei Strategie „Meine Reihenfolge" fließt jeder Extra-Euro genau in dieser Reihenfolge.</div></div>
      <div class="filters" style="margin:0"><input id="dq" placeholder="Suchen …" oninput="renderDebtTable()" style="max-width:180px"><select id="daf" onchange="renderDebtTable()" style="max-width:160px"><option value="">Alle Bereiche</option>${AREAS.map(a=>`<option>${a}</option>`).join('')}</select>
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer"><input type="checkbox" style="width:auto" ${debtShowDone?'checked':''} onchange="debtShowDone=this.checked;renderDebtTable()"> Erledigte zeigen</label></div>
    </div>
    <div id="debtTable"></div>
  </div>
  <div class="grid cols3" style="margin-bottom:16px">
    <div class="card">
      <div class="card-head"><h3>Tilgungsstrategie</h3></div>
      <div class="field"><label>Reihenfolge der Extra-Tilgung</label><select onchange="S.settings.debtStrategy=this.value;persist();render()">${Object.entries(STRATEGIES).map(([k,v])=>`<option value="${k}" ${S.settings.debtStrategy===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="margin-top:12px"><label>Monatliches Schuldenbudget</label><input type="number" step="0.01" min="0" value="${S.settings.debtBudget||''}" onchange="S.settings.debtBudget=num(this.value);persist();render()" placeholder="z. B. 1500"></div>
      <div class="hint" style="margin-top:10px">Mindestzahlungen werden immer zuerst gedeckt, der Rest fließt nach Strategie.</div>
    </div>
    <div class="card"><div class="card-head"><h3>Fortschritt</h3></div><div class="ring-wrap"><div class="chartbox sm" style="width:160px"><canvas id="debtRing"></canvas></div><div style="text-align:center"><div style="font-family:'Sora';font-size:24px;font-weight:800">${pct(m.progress)}</div><div class="hint">${eur0(m.open)} von ${eur0(m.original)} offen</div></div></div></div>
    <div class="card"><div class="card-head"><h3>Nach Bereich</h3></div><div class="chartbox sm"><canvas id="debtArea"></canvas></div></div>
  </div>
  <div class="grid cols2">
    <div class="card"><div class="card-head"><h3>Zahlungsplan</h3><span class="hint">${STRATEGIES[S.settings.debtStrategy]||''}</span></div>${plan.rows.length?planTimeline(plan):emptyBox('🧭','Kein Plan möglich','Erfasse eine offene Verbindlichkeit mit Rate oder ein Schuldenbudget.','')}</div>
    <div class="card"><div class="card-head"><h3>Zahlungsverlauf</h3></div>${paymentsTable()}</div>
  </div>`;
  makeDoughnut('debtRing',['Getilgt','Offen'],[m.paid,m.open],['#34d399','rgba(148,163,184,.25)']);
  const byArea={};m.active.forEach(d=>byArea[d.area||'Privat']=(byArea[d.area||'Privat']||0)+num(d.current));
  if(Object.keys(byArea).length)makeBar('debtArea',Object.keys(byArea),Object.values(byArea),Object.keys(byArea).map(a=>a==='Geschäftlich'?'#f5b14c':a==='Gemischt'?'#a78bfa':'#38bdf8'));
  else $('#debtArea').parentElement.innerHTML='<p class="hint">Keine offenen Posten.</p>';
  renderDebtTable();
}
function renderDebtTable(){
  const el=$('#debtTable');if(!el)return;
  const q=($('#dq')?.value||'').toLowerCase(),af=$('#daf')?.value||'';
  const plan=buildPlan();
  let pos=0;
  const rows=S.debts.filter(d=>(debtShowDone||d.status!=='Erledigt')&&(!q||[d.creditor,d.purpose,d.type,d.notes].join(' ').toLowerCase().includes(q))&&(!af||d.area===af));
  const hidden=S.debts.filter(d=>d.status==='Erledigt').length;
  el.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th class="h"></th><th>#</th><th>Gläubiger</th><th>Offen</th><th>Fortschritt</th><th>Rate</th><th>Abbuchung</th><th>Fällig / Status</th><th></th></tr></thead><tbody data-sortable="debts">${
    rows.map(d=>{const done=d.status==='Erledigt';if(!done)pos++;const po=plan.payoff[d.id];const mand=mandateFor('debts',d.id);return `<tr data-id="${d.id}" style="${done?'opacity:.55':''}">
      <td class="h">${dragHandle()}</td>
      <td><span class="posno">${done?'✓':pos}</span></td>
      <td><b>${esc(d.creditor)}</b><div class="sub">${esc(d.purpose||d.type||'')} · ${esc(d.area||'Privat')}</div></td>
      <td class="num"><b>${eur(d.current)}</b><div class="sub">urspr. ${eur0(d.original)}</div></td>
      <td style="min-width:110px"><div class="progress"><div class="bar" style="width:${debtProgress(d)}%"></div></div><div class="sub">${pct(debtProgress(d))}${po!=null?` · weg ~${monthLabel.format(addMonths(new Date(),po))}`:''}</div></td>
      <td class="num">${eur(debtRate(d))}<div class="sub">min ${eur0(d.minimum)}${num(d.rate)?' · '+pct(num(d.rate))+' Zins':''}</div></td>
      <td>${esc(accountName(mand?.accountId||d.accountId)||'–')}<div class="sub">${debtRate(d)?`am ${num(d.payDay)||1}.`:''}${mand?' · SEPA ✓':''}</div></td>
      <td>${d.dueDate?`<span class="pill ${dueClass(d)}">${fmtDate(d.dueDate)}</span>`:''}${d.status!=='Aktiv'?` <span class="pill ${done?'good':'warn'}">${esc(d.status)}</span>`:(!d.dueDate?'<span class="sub">–</span>':'')}</td>
      <td><div class="row-act"><button class="iconbtn" onclick="openDebt('${d.id}')" aria-label="Bearbeiten">✎</button>${done?'':`<button class="iconbtn" onclick="openPay('${d.id}')" title="Zahlung eintragen">€</button>`}<button class="iconbtn del" onclick="delDebt('${d.id}')" aria-label="Löschen">✕</button></div></td>
    </tr>`;}).join('')}</tbody></table></div><p class="sort-hint" style="margin-top:10px">${icMoveSmall()} Zeilen am ⋮⋮-Griff nach oben/unten ziehen.${!debtShowDone&&hidden?` ${hidden} erledigte ausgeblendet.`:''}</p>`
    :emptyBox('💳','Keine offenen Verbindlichkeiten',hidden?`${hidden} erledigte Position(en) ausgeblendet.`:'Lege deine erste Verbindlichkeit mit Betrag, Rate und Fälligkeit an.',`<button class="btn primary sm" onclick="openDebt()">Verbindlichkeit anlegen</button>`);
}
function planTimeline(plan){return `<div class="table-wrap"><table style="min-width:0"><thead><tr><th>Monat</th><th>Gezahlt</th><th>Zinsen</th><th>Restschuld</th></tr></thead><tbody>${plan.rows.slice(0,12).map(r=>`<tr><td><b>${monthLabel.format(r.date)}</b>${r.focus?`<div class="sub">Fokus: ${esc(r.focus)}</div>`:''}</td><td class="num">${eur(r.paid)}</td><td class="num">${eur(r.interest)}</td><td class="num">${eur(r.remaining)}</td></tr>`).join('')}</tbody></table></div><p class="hint">Nächste 12 Monate. Geschätzte Zinsen bis schuldenfrei: ${eur(plan.totalInterest)}.</p>`;}
function paymentsTable(){if(!S.payments.length)return emptyBox('🧾','Noch keine Zahlungen','Zahlungen senken automatisch die Restschuld. Am schnellsten im Finanz-Check.','');return `<div class="table-wrap"><table style="min-width:0"><thead><tr><th>Datum</th><th>Gläubiger</th><th>Betrag</th><th></th></tr></thead><tbody>${[...S.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,12).map(p=>{const d=S.debts.find(x=>x.id===p.debtId);return `<tr><td>${fmtDate(p.date)}</td><td>${esc(d?.creditor||'gelöscht')}${p.note?`<div class="sub">${esc(p.note)}</div>`:''}</td><td class="num"><b>${eur(p.amount)}</b></td><td><button class="iconbtn del" onclick="delPay('${p.id}')" aria-label="Löschen">✕</button></td></tr>`;}).join('')}</tbody></table></div>`;}

function openDebt(idv){const d=S.debts.find(x=>x.id===idv)||{area:'Privat',type:'Darlehen',priority:3,status:'Aktiv',payDay:1};
  openModal(idv?'Verbindlichkeit bearbeiten':'Neue Verbindlichkeit',`<form onsubmit="saveDebt(event,'${idv||''}')"><div class="form">
    <div class="field"><label>Gläubiger</label><input id="d_cred" required value="${esc(d.creditor||'')}" placeholder="Bank, Finanzamt, Lieferant"></div>
    <div class="field"><label>Zweck / Aktenzeichen</label><input id="d_purpose" value="${esc(d.purpose||'')}" placeholder="Darlehen, Rechnung …"></div>

    <div class="field"><label>Zins p. a. (%)</label><input id="d_rate" type="number" step="0.01" min="0" value="${d.rate||''}"></div>
    <div class="field"><label>Mindestzahlung / Monat</label><input id="d_min" type="number" step="0.01" min="0" value="${d.minimum||''}"></div>
    <div class="field"><label>Geplante Rate / Monat</label><input id="d_plan" type="number" step="0.01" min="0" value="${d.planned||''}"></div>
    <div class="field"><label>Abbuchung am (Tag)</label><input id="d_payday" type="number" min="1" max="28" value="${d.payDay||1}"></div>
    <div class="field"><label>Von Konto</label><select id="d_acc">${accountOptions(d.accountId)}</select></div>
    <div class="field"><label>Bis wann zurückzahlen?</label><input id="d_due" type="date" value="${d.dueDate||''}"></div>
    <div class="field"><label>Status</label><select id="d_status">${DEBT_STATUS.map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>Priorität (optional)</label><select id="d_prio">${[1,2,3,4].map(p=>`<option value="${p}" ${num(d.priority)===p?'selected':''}>${p} ${['','sehr hoch','hoch','normal','niedrig'][p]}</option>`).join('')}</select></div>
    <div class="field full"><label>Notizen / Vereinbarung</label><textarea id="d_notes" placeholder="Ansprechpartner, Ratenvereinbarung, Vergleich …">${esc(d.notes||'')}</textarea></div>
  </div>${modalFoot()}</form>`);}
function saveDebt(e,idv){e.preventDefault();upsert('debts',{id:idv||uid(),creditor:$('#d_cred').value.trim(),purpose:$('#d_purpose').value.trim(),area:$('#d_area').value,type:$('#d_type').value,original:num($('#d_orig').value),current:num($('#d_cur').value),rate:num($('#d_rate').value),minimum:num($('#d_min').value),planned:num($('#d_plan').value),payDay:Math.min(28,Math.max(1,num($('#d_payday').value)||1)),accountId:$('#d_acc').value,dueDate:$('#d_due').value,priority:num($('#d_prio').value),status:$('#d_status').value,notes:$('#d_notes').value.trim()});persist();closeModal();render();toast('Verbindlichkeit gespeichert');}
function delDebt(idv){if(confirm('Verbindlichkeit löschen? Zahlungen bleiben im Verlauf.')){S.debts=S.debts.filter(x=>x.id!==idv);unlinkMandates('debts',idv);persist();render();toast('Gelöscht');}}
function openPay(pre){const ds=S.debts.filter(d=>num(d.current)>0&&d.status!=='Erledigt');if(!ds.length)return toast('Keine offene Verbindlichkeit');
  const sel=ds.find(d=>d.id===pre)||ds[0];
  openModal('Zahlung eintragen',`<form onsubmit="savePay(event)"><div class="form">
    <div class="field full"><label>Verbindlichkeit</label><select id="p_debt" onchange="const d=S.debts.find(x=>x.id===this.value);if(d)$('#p_amount').value=debtRate(d)||''">${ds.map(d=>`<option value="${d.id}" ${sel.id===d.id?'selected':''}>${esc(d.creditor)} · offen ${eur(d.current)}</option>`).join('')}</select></div>
    <div class="field"><label>Datum</label><input id="p_date" type="date" value="${today()}"></div>
    <div class="field"><label>Betrag</label><input id="p_amount" type="number" step="0.01" min="0" required value="${debtRate(sel)||''}"></div>
    <div class="field full"><label>Notiz</label><input id="p_note" placeholder="Überweisung, Sonderzahlung …"></div>
  </div>${modalFoot('good','Zahlung speichern')}</form>`);}
function savePay(e){e.preventDefault();const p={id:uid(),debtId:$('#p_debt').value,date:$('#p_date').value,amount:num($('#p_amount').value),note:$('#p_note').value.trim()};const d=S.debts.find(x=>x.id===p.debtId);if(d){d.current=Math.max(0,num(d.current)-p.amount);if(d.current<=.01)d.status='Erledigt';}S.payments.push(p);persist();closeModal();render();toast(d&&d.status==='Erledigt'?`🎉 ${d.creditor} ist abbezahlt!`:'Zahlung gespeichert');}
function delPay(idv){const p=S.payments.find(x=>x.id===idv);if(!p)return;if(confirm('Zahlung löschen und Betrag zur Restschuld zurückbuchen?')){const d=S.debts.find(x=>x.id===p.debtId);if(d){d.current=num(d.current)+num(p.amount);if(d.status==='Erledigt')d.status='Aktiv';}S.payments=S.payments.filter(x=>x.id!==idv);persist();render();toast('Zahlung gelöscht');}}

function viewGoals(){
  view.innerHTML=topbar('Privat','privat','Sparziele','Rücklagen für Notgroschen, Steuer oder Wünsche. Das wichtigste Ziel nach vorne ziehen (⋮⋮).',
    `<button class="btn primary" onclick="openGoal()">${icPlus()} Sparziel</button>`)
  + `<div class="grid cols3 keep2" style="margin-bottom:16px">
    ${kpi('Gespart gesamt',eur(S.goals.reduce((s,g)=>s+num(g.saved),0)),`von ${eur0(S.goals.reduce((s,g)=>s+num(g.target),0))}`,icTarget(),'var(--good)')}
    ${kpi('Ziele',String(S.goals.length),'',null)}
    ${kpi('Sparrate / Monat',eur(S.goals.reduce((s,g)=>s+num(g.rate),0)),'fließt in den Monatsplan',icUp(),'var(--accent)')}
  </div>
  <div class="grid cols2" data-sortable="goals" data-layout="grid" id="goalGrid"></div>`;
  const g=$('#goalGrid');

function yearPicker(){const ys=[];const cy=new Date().getFullYear();for(let y=cy+1;y>=cy-4;y--)ys.push(y);return `<select onchange="S.settings.taxYear=Number(this.value);persist();render()" style="max-width:120px">${ys.map(y=>`<option value="${y}" ${bizYear()===y?'selected':''}>${y}</option>`).join('')}</select>`;}
function vatDeadlines(){
  // USt-Voranmeldung: bis zum 10. des Folgemonats nach Ende des Voranmeldungszeitraums.
  const rhythm=S.settings.vatFiling||'quartal';
  const now=new Date();const rows=[];
  function due(periodEnd,label){
    // Abgabe bis 10. des Folgemonats
    const d=new Date(periodEnd.getFullYear(),periodEnd.getMonth()+1,10);
    if(d>=new Date(now.getFullYear(),now.getMonth(),now.getDate()))rows.push({label,date:d});
  }
  if(rhythm==='monat'){
    for(let i=0;i<6;i++){const m=new Date(now.getFullYear(),now.getMonth()+i,1);due(new Date(m.getFullYear(),m.getMonth()+1,0),monthLabel.format(m));}
  }else if(rhythm==='quartal'){
    for(let q=-1;q<5;q++){const startMonth=Math.floor(now.getMonth()/3)*3+q*3;const qs=new Date(now.getFullYear(),startMonth,1);const qe=new Date(qs.getFullYear(),qs.getMonth()+3,0);due(qe,`Q${Math.floor(qs.getMonth()/3)+1} ${qs.getFullYear()}`);}
  }else{
    const ye=new Date(bizYear(),11,31);const d=new Date(bizYear()+1,6,31);rows.push({label:`Jahreserklärung ${bizYear()}`,date:d});
  }
  rows.sort((a,b)=>a.date-b.date);
  const shown=rows.slice(0,4);
  if(!shown.length)return `<p class="hint">Keine anstehenden Termine im Berechnungszeitraum.</p>`;
  return `<div class="table-wrap"><table><thead><tr><th>Zeitraum</th><th>Abgabe bis</th><th>In</th></tr></thead><tbody>${shown.map(r=>{const dd=Math.ceil((r.date-now)/86400000);return `<tr><td><b>${r.label}</b></td><td>${r.date.toLocaleDateString('de-DE')}</td><td><span class="pill ${dd<=10?'warn':'good'}">${dd} Tage</span></td></tr>`;}).join('')}</tbody></table></div><p class="hint">Abgabe jeweils bis zum 10. des Folgemonats (ohne Dauerfristverlängerung). Ohne Gewähr – Termine beim Finanzamt/ELSTER prüfen.</p>`;
}
function taxInsights(t){const out=[];
  if(t.c.net===0)out.push({k:'',i:'💼',t:'Noch keine Provisionen erfasst',s:'Trage Abrechnungen ein, damit die Prognose rechnen kann.'});
  if(t.due>0)out.push({k:'warn',i:'🏦',t:`Lege ${eur0(t.due)} für die Einkommensteuer zurück`,s:'Am besten auf ein separates Steuer-Unterkonto.'});
  if(S.settings.vatLiable&&t.vatPayable>0)out.push({k:'warn',i:'🏛️',t:`USt-Zahllast ~${eur0(t.vatPayable)}`,s:'Denk an die Umsatzsteuer-Voranmeldung (monatlich/quartalsweise).'});
  if(S.settings.vatLiable&&t.vatPayable<0)out.push({k:'good',i:'↩️',t:`Vorsteuerüberhang ${eur0(Math.abs(t.vatPayable))}`,s:'Du bekommst voraussichtlich USt erstattet.'});
  const ratio=t.c.net?((t.e.net+t.bizFix)/t.c.net*100):0;
  if(t.c.net>0)out.push({k:'',i:'📊',t:`Ausgabenquote ${pct(ratio)}`,s:'Verhältnis Betriebsausgaben zu Umsatz.'});
  if(t.profit>0)out.push({k:'good',i:'✅',t:`Gewinn-Marge ${pct(t.profit/t.c.net*100)}`,s:'Behalte sie über die Monate im Blick.'});
  return out;
}

function mdLinkUI(){const v=$('#md_link').value;document.querySelectorAll('.md-own').forEach(el=>el.style.display=v?'none':'');

function saveMandate(e,idv){e.preventDefault();const link=$('#md_link').value;const o={id:idv||uid(),creditor:$('#md_cred').value.trim(),accountId:$('#md_acc').value,link,amount:link?0:num($('#md_amount').value),interval:$('#md_int').value,due:link?'':$('#md_due').value,ref:$('#md_ref').value.trim(),creditorId:$('#md_cid').value.trim(),active:$('#md_active').value==='true'};
  upsert('mandates',o);const l=linkedItem(o);if(l&&o.accountId)l.item.accountId=o.accountId;persist();closeModal();render();toast('Mandat gespeichert');}
function delMandate(idv){if(confirm('Mandat löschen?')){S.mandates=S.mandates.filter(x=>x.id!==idv);persist();render();toast('Gelöscht');}}

/* Konto-Detail */
let currentAccount=null;
function openAccountDetail(id){currentAccount=id;go('accountDetail');}
function viewAccountDetail(){
  const a=S.accounts.find(x=>x.id===currentAccount);
  if(!a){current='accounts';return viewAccounts();}
  const fc=liquidityForecast(a.id,90);
  const linked=cashflowSources().filter(s=>s.accountId===a.id);
  const monthlyOut=linked.filter(s=>s.amount<0).reduce((s,x)=>s+toMonthly(-x.amount,x.interval),0);
  view.innerHTML=topbar('Konten & SEPA','',esc(a.name),`${esc(a.bank||'')}${a.iban?' · '+esc(a.iban):''} · ${esc(a.type)}`,
    `<button class="btn ghost" onclick="go('accounts')">← Alle Konten</button><button class="btn" onclick="openAcc('${a.id}')">${icSliders()} Bearbeiten</button>`)
  + `<div class="grid cols4 keep2" style="margin-bottom:16px">
    ${kpi('Aktueller Saldo',eur(a.balance),a.updated?'Stand '+fmtDate(a.updated):'Stand unbekannt',icBank(),num(a.balance)>=0?'var(--good)':'var(--bad)')}
    ${kpi('Abgänge / Monat',eur(monthlyOut),`${linked.filter(s=>s.amount<0).length} Posten`,icDown(),'var(--biz)')}
    ${kpi('Saldo in 90 Tagen',eur(fc.end),'nach allen Buchungen',icTrend(),fc.end>=0?'var(--good)':'var(--bad)')}
    ${kpi('Tiefststand',eur(fc.minBal),fc.minDate?fmtD(fc.minDate):'–',icWarn(),fc.minBal<0?'var(--bad)':fc.minBal<200?'var(--warn)':'var(--good)')}
  </div>
  ${fc.firstNeg?`<div class="card" style="margin-bottom:16px;border-color:rgba(248,113,113,.4)"><div class="insight bad"><div class="ii">🔴</div><div><b>Achtung: Konto rutscht ins Minus</b><span>Am ${fmtD(fc.firstNeg)} fällt „${esc(a.name)}" voraussichtlich unter 0 €. Plane eine Umbuchung oder verschiebe eine Belastung.</span></div></div></div>`:''}
  <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Liquiditätsvorschau – 90 Tage</h3><span class="hint">Start ${eur0(fc.start)}</span></div><div class="chartbox"><canvas id="accForecast"></canvas></div></div>
  <div class="grid cols2">
    <div class="card"><div class="card-head"><h3>Kommende Buchungen</h3></div>${forecastTable(fc)}</div>
    <div class="card"><div class="card-head"><h3>Was hängt an diesem Konto?</h3></div>${linked.length?`<div class="table-wrap"><table style="min-width:0"><thead><tr><th>Posten</th><th>Typ</th><th>≈ / Monat</th></tr></thead><tbody>${linked.sort((x,y)=>toMonthly(Math.abs(y.amount),y.interval)-toMonthly(Math.abs(x.amount),x.interval)).map(x=>`<tr style="cursor:pointer" onclick="go('${x.go}')"><td><b>${esc(x.label)}</b></td><td><span class="pill">${esc(x.kind)}</span></td><td class="num" style="color:${x.amount<0?'inherit':'var(--good)'}">${x.amount<0?'':'+'}${eur(toMonthly(Math.abs(x.amount),x.interval))}</td></tr>`).join('')}</tbody></table></div>`
      :emptyBox('🔗','Noch nichts verknüpft','Wähle bei Fixkosten, Verträgen, Versicherungen oder Verbindlichkeiten dieses Konto als „Belastetes Konto" – oder zieh ein SEPA-Mandat hierher.','')}</div>
  </div>`;
  forecastChart('accForecast',fc);
}
function forecastTable(fc){if(!fc.rows.length)return emptyBox('🗓️','Keine geplanten Buchungen','Verknüpfe Posten mit diesem Konto, damit hier die Vorschau erscheint.','');
  return `<div class="table-wrap"><table style="min-width:0"><thead><tr><th>Datum</th><th>Posten</th><th>Betrag</th><th>Saldo danach</th></tr></thead><tbody>${fc.rows.slice(0,20).map(r=>`<tr><td>${fmtD(r.date)}</td><td><b>${esc(r.label)}</b><div class="sub">${esc(r.kind)}</div></td><td class="num" style="color:${r.amount<0?'var(--bad)':'var(--good)'}">${r.amount<0?'−':'+'}${eur(Math.abs(r.amount))}</td><td class="num" style="color:${r.balance<0?'var(--bad)':'inherit'}"><b>${eur(r.balance)}</b></td></tr>`).join('')}</tbody></table></div>`;}

      <div style="height:8px"></div>
      <div class="kv"><span class="k">Umsatzsteuer vereinnahmt</span><span class="v num">${eur(t.c.vat)}</span></div>
      <div class="kv"><span class="k">− Vorsteuer</span><span class="v num">−${eur(t.e.vat)}</span></div>
      <div class="kv"><span class="k" style="color:var(--text);font-weight:700">= USt-Zahllast</span><span class="v num">${eur(t.vatPayable)}</span></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Annahmen</h3></div>
      <div class="field"><label>Berechnungsart</label><select onchange="S.settings.taxMode=this.value;persist();render()"><option value="progressiv" ${(S.settings.taxMode||'progressiv')==='progressiv'?'selected':''}>Progressiv (§32a EStG)</option><option value="pauschal" ${S.settings.taxMode==='pauschal'?'selected':''}>Pauschaler Schätzsatz</option></select></div>
      ${(S.settings.taxMode==='pauschal')?`<div class="field" style="margin-top:10px"><label>Einkommensteuersatz (%)</label><input type="number" step="0.5" min="0" max="60" value="${S.settings.incomeTaxRate}" onchange="S.settings.incomeTaxRate=num(this.value);persist();render()"></div>`:`<div class="field" style="margin-top:10px"><label>Weitere Einkünfte (optional)</label><input type="number" step="0.01" value="${S.settings.otherIncome||''}" onchange="S.settings.otherIncome=num(this.value);persist();render()" placeholder="z. B. Vermietung"></div>`}
      <div class="field" style="margin-top:10px"><label>USt-pflichtig?</label><select onchange="S.settings.vatLiable=this.value==='ja';persist();render()"><option value="ja" ${S.settings.vatLiable?'selected':''}>Ja (Regelbesteuerung)</option><option value="nein" ${!S.settings.vatLiable?'selected':''}>Nein (Kleinunternehmer §19)</option></select></div>
      <div class="field" style="margin-top:10px"><label>USt-Voranmeldung</label><select onchange="S.settings.vatFiling=this.value;persist();render()"><option value="monat" ${S.settings.vatFiling==='monat'?'selected':''}>monatlich</option><option value="quartal" ${(S.settings.vatFiling||'quartal')==='quartal'?'selected':''}>quartalsweise</option><option value="jahr" ${S.settings.vatFiling==='jahr'?'selected':''}>jährlich</option></select></div>
      <div class="field" style="margin-top:10px"><label>Standard USt-Satz (%)</label><input type="number" step="1" min="0" value="${S.settings.vatRate}" onchange="S.settings.vatRate=num(this.value);persist();render()"></div>
      <div class="field" style="margin-top:10px"><label>Solidaritätszuschlag</label><select onchange="S.settings.soliMode=this.value;persist();render()"><option value="auto" ${S.settings.soliMode!=='aus'?'selected':''}>automatisch (mit Freigrenze)</option><option value="aus" ${S.settings.soliMode==='aus'?'selected':''}>nicht berechnen</option></select></div>
      <div class="field" style="margin-top:10px"><label>Kirchensteuer (% der ESt)</label><input type="number" step="1" min="0" value="${S.settings.churchTax||''}" onchange="S.settings.churchTax=num(this.value);persist();render()" placeholder="0, 8 oder 9"></div>
      <div class="field" style="margin-top:10px"><label>Arbeitsweg (km, einfach)</label><input type="number" step="1" min="0" value="${S.settings.commuteKm||''}" onchange="S.settings.commuteKm=num(this.value);persist();render()" placeholder="für Kfz 1-%-Regel"></div>
      <div class="field" style="margin-top:10px"><label>Geleistete Vorauszahlungen ${y}</label><input type="number" step="0.01" min="0" value="${S.settings.advancePayment||''}" onchange="S.settings.advancePayment=num(this.value);persist();render()"></div>
    </div>
  </div>
  <div class="grid cols2">
    <div class="card"><div class="card-head"><h3>Umsatz vs. Ausgaben ${y}</h3></div><div class="chartbox sm"><canvas id="taxChart"></canvas></div></div>
    <div class="card"><div class="card-head"><h3>Steuer-Tipps</h3></div>${insightCard(taxInsights(t))}</div>
  </div>
  ${S.settings.vatLiable?`<div class="card" style="margin-top:16px"><div class="card-head"><h3>${icCalendar()} USt-Voranmeldung – nächste Termine</h3><span class="pill business">${S.settings.vatFiling==='monat'?'monatlich':S.settings.vatFiling==='jahr'?'jährlich':'quartalsweise'}</span></div>${vatDeadlines()}</div>`:''}
  <div class="card" style="margin-top:16px">
    <div class="insight"><div class="ii">ℹ️</div><div><b>Hinweis</b><span>Vereinfachte Schätzung (Grundtarif, Einzelveranlagung) zur eigenen Vorbereitung – ersetzt keine Steuerberatung. Gewerbesteuer ist nicht berücksichtigt (Freibetrag 24.500 €, wird weitgehend auf die ESt angerechnet).</span></div></div>
  </div>`;
  makeBar('taxChart',['Umsatz netto','Ausgaben netto','Gewinn'],[t.c.net,t.e.net+t.bizFix,t.profit],['#34d399','#f87171','#f5b14c']);
}
function renderSpecialTab(y){
  const sd=specialDeductions(y);const totalPaid=sd.list.reduce((s,x)=>s+num(x.amount),0);
  $('#taxBody').innerHTML=`<div class="grid cols3 keep2" style="margin-bottom:16px">
    ${kpi('Gezahlt '+y,eur(totalPaid),'Beiträge gesamt',icHeart(),'var(--priv)')}
    ${kpi('Davon absetzbar',eur(sd.total),'mindert z. v. E.',icScale(),'var(--good)')}
    ${kpi('Positionen',String(sd.list.length),'',null)}
  </div>
  <div class="card"><div class="card-head"><h3>Sonderausgaben ${y}</h3><button class="btn primary sm" onclick="openSpecial()">${icPlus()} Sonderausgabe</button></div>${specialsTable(sd)}</div>
  <div class="card" style="margin-top:16px"><div class="insight"><div class="ii">ℹ️</div><div><b>PKV-Hinweis</b><span>Beim Beitrag den vollen Jahresbeitrag eintragen, beim absetzbaren Anteil nur den Basistarif (Kranken ohne Komfortleistungen wie Chefarzt/Einbettzimmer; Pflege in der Regel voll). Den genauen Betrag findest du in der Jahresbescheinigung deiner Versicherung.</span></div></div></div>`;
}

/* ========================================================================
   DATEN & BACKUP
   ======================================================================== */
function viewData(){
  const counts=[['Fixkosten',S.fixed.length],['Variable Budgets',S.variables.length],['Verbindlichkeiten',S.debts.length],['Zahlungen',S.payments.length],['Monatsabschlüsse',S.months.length],['Provisionen',S.commissions.length],['Betriebsausgaben',S.expenses.length],['Fahrzeuge',S.vehicles.length],['Reisen',S.trips.length],['Homeoffice',S.homeoffice.length],['Sonderausgaben',S.specials.length],['Konten',S.accounts.length],['SEPA-Mandate',S.mandates.length],['Versicherungen',S.insurances.length],['Verträge',S.contracts.length],['Sparziele',S.goals.length],['Finanz-Checks',S.checks.length]];
  const lb=S.settings.lastBackup;const lbDays=lb?daysUntil(lb):null;
  view.innerHTML=topbar('System','','Daten & Abgleich','Deine Daten liegen nur auf deinen Geräten. Mac und iPad gleichst du über eine Sync-Datei in iCloud Drive ab.','')
  + `<div class="card" style="margin-bottom:16px;border-color:rgba(56,189,248,.35)">
    <div class="card-head"><h3>⇅ Abgleich Mac ↔ iPad</h3><span class="pill">dieses Gerät: ${esc(deviceName())} · <button class="linkbtn" onclick="renameDevice()">ändern</button></span></div>
    <div class="sync-box">
      <div class="col">${syncButtons(false)}
        <p class="hint" style="margin-top:12px">${syncStatusText()}</p></div>
      <div class="col"><b style="font-size:13.5px">So geht's</b>
        <ol class="sync-steps">
          <li>Auf dem Gerät, auf dem du zuletzt gearbeitet hast: <b>Sync-Datei speichern</b> → in <b>iCloud Drive</b> ablegen (immer gleicher Name, alte Datei ersetzen).</li>
          <li>Auf dem anderen Gerät: <b>Sync-Datei laden</b> → dieselbe Datei aus iCloud Drive wählen.</li>
          <li>Fertig: Änderungen von beiden Geräten werden <b>zusammengeführt</b> – der jeweils neueste Stand je Eintrag gewinnt, Löschungen werden übernommen.</li>
        </ol></div>
    </div>
  </div>
  <div class="grid cols2" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><h3>${icDown()} Backup &amp; Übertragung</h3>${lb?`<span class="pill ${lbDays<-31?'warn':'good'}">letztes: ${fmtDate(lb)}</span>`:'<span class="pill warn">noch nie</span>'}</div>
      <p class="hint" style="margin-bottom:14px">Lädt alle Daten als JSON-Datei herunter. Auf einem anderen Gerät oder Browser über „Importieren" wieder einspielen.</p>
      <div class="row-act"><button class="btn primary" onclick="exportData();render()">${icDown()} Backup exportieren</button>
      <label class="btn" for="importInput" style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--text)">${icUp()} Backup importieren</label><input id="importInput" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></div>
    </div>
    <div class="card"><div class="card-head"><h3>${icBell()} Erinnerung an den Finanz-Check</h3></div>
      <p class="hint" style="margin-bottom:14px">Am ${checkDays().map(d=>d+'.').join(' und ')} jedes Monats um ${esc(S.settings.checkTime||'18:00')} Uhr. Die Kalender-Datei einmal öffnen – dann erinnert dich dein Kalender (Mac & iPhone) automatisch.</p>
      <div class="row-act"><button class="btn primary" onclick="downloadICS()">${icCalendar()} Kalender-Datei laden</button><button class="btn" onclick="openCheckSettings()">Tage & Uhrzeit ändern</button></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Gespeicherte Einträge</h3></div>
    <div class="grid cols3" style="gap:0 24px">${counts.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v num">${v}</span></div>`).join('')}</div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Alte Einzel-Tools</h3></div>
    <p class="hint">Die früheren Tools „Fixkosten Cockpit" und „Verbindlichkeiten" liegen jetzt im Ordner <b>Archiv</b>. ${S.meta.migrated?'Ihre Daten wurden beim ersten Start übernommen. ':''}Falls dort noch etwas nachgetragen wurde, kannst du es erneut einlesen (Duplikate werden zusammengeführt).</p>
    <button class="btn sm" style="margin-top:10px" onclick="reimportOld()">Aus alten Tools nachladen</button>
  </div>
  <div class="card" style="border-color:rgba(248,113,113,.25)"><div class="card-head"><h3 style="color:#fecaca">Zurücksetzen</h3></div>
    <p class="hint" style="margin-bottom:12px">Löscht alle in MOEL Finance gespeicherten Daten. Vorher unbedingt ein Backup exportieren.</p>
    <button class="btn danger" onclick="resetAll()">Alle Daten löschen</button>
  </div>`;
}
/* ========================================================================
   ABGLEICH MAC ↔ IPAD (per Sync-Datei, z. B. in iCloud Drive)
   ======================================================================== */
const SYNC_FILE='MOEL-Finance-Sync.json';
const isTouch=()=>matchMedia('(pointer:coarse)').matches;
function deviceName(){let n='';try{n=localStorage.getItem('moel_device_name')||'';}catch(e){}
  if(n)return n;const ua=navigator.userAgent;
  return /iPhone/.test(ua)?'iPhone':(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))?'iPad':/Macintosh/.test(ua)?'Mac':'Computer';}
function renameDevice(){const n=prompt('Name für dieses Gerät:',deviceName());if(n&&n.trim()){try{localStorage.setItem('moel_device_name',n.trim());}catch(e){}render();}}
function syncStatusText(){const m=S.meta;const parts=[];
  if(m.lastSyncOut)parts.push(`Zuletzt gespeichert: ${new Date(m.lastSyncOut).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}`);
  if(m.lastSyncIn)parts.push(`zuletzt geladen: ${new Date(m.lastSyncIn).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}${m.lastSyncFrom?' (von '+esc(m.lastSyncFrom)+')':''}`);
  return parts.length?parts.join(' · ')+'.':'Noch kein Abgleich gemacht.';}
function syncButtons(compact){let undo=false;try{undo=!!localStorage.getItem(KEY+'_vor_abgleich');}catch(e){}
  return `<div class="row-act"><label class="btn" for="syncIn${compact?'C':''}" style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--text);cursor:pointer">${icDown()} Sync-Datei laden</label><input id="syncIn${compact?'C':''}" type="file" accept="application/json,.json" style="display:none" onchange="syncImport(event)">
    <button class="btn primary" onclick="syncExport()">${icUp()} Sync-Datei speichern</button>
    ${undo&&!compact?`<button class="btn ghost sm" onclick="syncUndo()">↶ Letztes Laden rückgängig</button>`:''}</div>`;}
async function syncExport(){
  S.settings.lastBackup=today();S.meta.lastSyncOut=Date.now();S.meta.lastSyncDevice=deviceName();persist();
  const json=JSON.stringify(S);
  // Mac (Chrome/Edge): Speichern-Dialog, z. B. direkt nach iCloud Drive
  if(window.showSaveFilePicker&&!isTouch()){
    try{const h=await showSaveFilePicker({suggestedName:SYNC_FILE,types:[{description:'MOEL Finance Sync',accept:{'application/json':['.json']}}]});
      const w=await h.createWritable();await w.write(json);await w.close();toast('Sync-Datei gespeichert ✓');render();return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  // iPad/iPhone: Teilen-Menü → „In Dateien sichern" → iCloud Drive
  const file=new File([json],SYNC_FILE,{type:'application/json'});
  if(isTouch()&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'MOEL Finance Sync'});toast('Sync-Datei gespeichert ✓');render();return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=SYNC_FILE;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Sync-Datei geladen – nach iCloud Drive verschieben');render();
}
function totalItems(st){return COLLS.reduce((n,k)=>n+((st[k]||[]).length),0);}
/* führt zwei Datenstände zusammen: je Eintrag gewinnt der neuere Stand, Löschungen werden übernommen */
function mergeStates(L,R){
  const st={added:0,updated:0,removed:0};
  const out=JSON.parse(JSON.stringify(L));const LM=L.meta||{},RM=R.meta||{};
  const del=Object.assign({},LM.deleted||{});Object.entries(RM.deleted||{}).forEach(([id,t])=>{if(!(del[id]>=t))del[id]=t;});
  COLLS.forEach(k=>{
    const la=L[k]||[],ra=Array.isArray(R[k])?R[k].filter(x=>x&&x.id):[];
    const map=new Map(la.map(x=>[x.id,x]));const isLocal=new Set(la.map(x=>x.id));
    ra.forEach(x=>{const l=map.get(x.id);if(!l){map.set(x.id,x);}else if((x.u||0)>(l.u||0)&&itemSig(x)!==itemSig(l)){map.set(x.id,x);st.updated++;}});
    const rNewer=((RM.orderU||{})[k]||0)>((LM.orderU||{})[k]||0);
    const seen=new Set(),ids=[];[...(rNewer?ra:la),...(rNewer?la:ra)].forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);ids.push(x.id);}});
    out[k]=ids.map(id=>map.get(id)).filter(x=>{const t=del[x.id];const gone=t&&t>=(x.u||0);
      if(gone&&isLocal.has(x.id))st.removed++;if(!gone&&!isLocal.has(x.id))st.added++;return !gone;});
    out.meta.orderU=out.meta.orderU||{};out.meta.orderU[k]=Math.max((LM.orderU||{})[k]||0,(RM.orderU||{})[k]||0);
  });
  out.meta.settingsU=Object.assign({},LM.settingsU||{});
  Object.keys(R.settings||{}).forEach(k=>{const rt=(RM.settingsU||{})[k]||0,lt=(LM.settingsU||{})[k]||0;
    if(rt>lt||!(k in (L.settings||{}))){out.settings[k]=R.settings[k];out.meta.settingsU[k]=rt;}});
  if((RM.draftU||0)>(LM.draftU||0)){out.checkDraft=R.checkDraft;out.meta.draftU=RM.draftU;}
  out.meta.deleted=del;
  return{state:out,stats:st};
}
function syncImport(e){const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||!d.settings||!d.meta)throw 0;}catch(err){alert('Das ist keine gültige MOEL-Finance-Datei.');return;}
    try{localStorage.setItem(KEY+'_vor_abgleich',JSON.stringify(S));}catch(err){}
    let msg;
    if(totalItems(S)===0){S=Object.assign(blankState(),d);msg=`Daten übernommen: ${totalItems(S)} Einträge`;}
    else{const res=mergeStates(S,d);S=res.state;const x=res.stats;
      msg=(x.added||x.updated||x.removed)?`Abgeglichen ✓ ${x.added} neu · ${x.updated} aktualisiert · ${x.removed} gelöscht`:'Abgeglichen ✓ – alles war schon aktuell';}
    S.meta.lastSyncIn=Date.now();S.meta.lastSyncFrom=d.meta.lastSyncDevice||'';
    normalize();initSnapshot();persist();renderSidebar();render();toast(msg);};
  r.readAsText(f);}
function syncUndo(){let raw=null;try{raw=localStorage.getItem(KEY+'_vor_abgleich');}catch(e){}if(!raw)return;
  if(!confirm('Den Stand von vor dem letzten Laden wiederherstellen?'))return;
  S=Object.assign(blankState(),JSON.parse(raw));normalize();initSnapshot();persist();try{localStorage.removeItem(KEY+'_vor_abgleich');}catch(e){}renderSidebar();render();toast('Wiederhergestellt');}

function exportData(){S.settings.lastBackup=today();persist();const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moel-finance-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup gespeichert ✓');}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw 0;
  if(!confirm('Backup importieren? Die aktuellen Daten in diesem Browser werden dabei ersetzt.'))return;
  S=Object.assign(blankState(),d);normalize();persist();renderSidebar();render();toast('Backup importiert');}catch(err){alert('Import fehlgeschlagen. Bitte eine gültige MOEL-Backup-Datei wählen.');}};r.readAsText(f);e.target.value='';}
function reimportOld(){const did=migrateOld();
  S.fixed=dedupe(S.fixed);S.variables=dedupe(S.variables);S.debts=dedupe(S.debts);S.payments=dedupe(S.payments);S.months=dedupe(S.months);
  persist();render();toast(did?'Alt-Daten nachgeladen':'Keine Alt-Daten gefunden');}
function dedupe(arr){const seen=new Set();return arr.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true;});}
function resetAll(){if(confirm('Wirklich ALLE MOEL-Finance-Daten löschen? Das lässt sich nicht rückgängig machen.')){localStorage.removeItem(KEY);S=blankState();persist();go('home');toast('Zurückgesetzt');}}

/* ========================================================================
   BOOT
   ======================================================================== */
load();
renderSidebar();
render();
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
/* Tab wieder geöffnet (z. B. am nächsten Tag) → Check-Status & Fristen neu berechnen */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#modal').classList.contains('show')&&!Sort.st){renderSidebar();if(current==='home'||current==='check')render();}});
</script>
